# Secrets this chart references but never renders (secrets.create: false,
# the default). Create these out of band before `helm install`, e.g.:
#
#   kubectl -n <namespace> apply -f my-real-secrets.yaml
#
# Replace every REPLACE_ME placeholder with a real value. Never commit the
# filled-in version of this file.
#
# Object names below use instance "hermes" as an example — substitute your
# own `instance` value everywhere it appears as a name prefix.
---
apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets # "<instance>-secrets"
  namespace: hermes
type: Opaque
stringData:
  API_SERVER_KEY: REPLACE_ME # generate a strong random key
  MINIMAX_API_KEY: REPLACE_ME
  # Only needed while postgresql.enabled=true (the default).
  POSTGRES_PASSWORD: REPLACE_ME
  # Only needed while terminal.enabled=true.
  TTYD_PASSWORD: REPLACE_ME
---
# Not instance-scoped: one Cloudflare Tunnel per namespace. Only needed
# while cloudflared.enabled=true.
apiVersion: v1
kind: Secret
metadata:
  name: cf-secrets
  namespace: hermes
type: Opaque
stringData:
  CF_API_TOKEN: REPLACE_ME
  CF_TUNNEL_TOKEN: REPLACE_ME
---
# Only needed on instances whose Deployment sets imagePullSecrets to
# reference it (see hermes.imagePullSecrets in a values file) — e.g. the
# cindytech1 instance, which pulls a custom image from a private registry.
apiVersion: v1
kind: Secret
metadata:
  name: jfrog-registry
  namespace: cindytech
type: kubernetes.io/dockerconfigjson
data:
  .dockerconfigjson: REPLACE_ME # base64 docker config, e.g. from `kubectl create secret docker-registry --dry-run=client -o yaml`
