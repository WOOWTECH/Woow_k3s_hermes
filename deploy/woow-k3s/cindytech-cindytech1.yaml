# Instance values for the live "cindytech1" release in namespace
# "cindytech". Shares the namespace with an unrelated Odoo/n8n stack for
# the same customer — cloudflared, ingress, terminal, disk-cleanup and
# networkPolicy all stay OFF here on purpose: cindytech's Cloudflare Tunnel
# belongs to that Odoo stack, not to this Hermes instance, and none of the
# other extras exist on this instance today.
#
# One value is supplied at apply time instead of being committed: the webui
# sidecar's password, which this instance stores as a PLAIN env value in the
# pod template. Pipe it in, never write it to a file — the render fails
# loudly if it is missing (placeholdersStrict):
#
#   helm upgrade --install cindytech-cindytech1 . -n cindytech \
#     -f deploy/woow-k3s/cindytech-cindytech1.yaml --take-ownership \
#     --set-string placeholders.WEBUI_PASSWORD="$WEBUIPASS"

instance: cindytech1


secrets:
  create: false

hermes:
  # service.webuiPort is deliberately NOT set (so no <instance>-webui-svc is
  # rendered). It was set to 8787 for a few hours on 2026-09-13 to stop
  # cindytech1-hermes.woowtech.io returning 502; the owner then retired that
  # hostname as unused, so the Service was removed again and, shortly after, the
  # webui sidecar it fronted was removed too (see extraContainers below).
  # Setting webuiPort alone would now render a Service with no container behind
  # it - restore the sidecar as well if that hostname ever comes back.

  # Replay of the live pod-template annotation left by a past `kubectl
  # rollout restart`; part of the pod-template hash.
  podAnnotations:
    kubectl.kubernetes.io/restartedAt: "2026-06-18T13:30:34+08:00"
  # Live name, not the chart default (<instance>-agent-sa): renaming the
  # ServiceAccount would change the pod template and restart the agent.
  serviceAccountName: hermes-agent-sa
  image:
    repository: jcr-prod.woowtech.io/woow-paas-docker-local/hermes-agent-custom
    tag: aorus-20260727
    pullPolicy: IfNotPresent
  # null (not {}): {} would deep-merge and leave the chart default labels
  # (component/part-of) in place; null is required to actually clear them.
  extraLabels: null
  svcExtraLabels: null
  svcRenderLabels: false
  imagePullSecrets:
    - name: jfrog-registry
  persistence:
    claimName: cindytech1-data
    storageClassName: longhorn
    size: 5Gi
  env:
    - {name: HERMES_DASHBOARD, value: "1"}
    - {name: HERMES_DASHBOARD_INSECURE, value: "1"}
    - {name: HERMES_DASHBOARD_TUI, value: "1"}
    - {name: HERMES_UID, value: "1000"}
    - {name: HERMES_GID, value: "1000"}
    - {name: API_SERVER_ENABLED, value: "true"}
    - {name: API_SERVER_HOST, value: "0.0.0.0"}
    - name: API_SERVER_KEY
      valueFrom: {secretKeyRef: {name: cindytech1-secrets, key: API_SERVER_KEY}}
    - {name: API_SERVER_CORS_ORIGINS, value: "*"}
    - {name: GATEWAY_ALLOW_ALL_USERS, value: "true"}
    - name: MINIMAX_API_KEY
      valueFrom: {secretKeyRef: {name: cindytech1-secrets, key: MINIMAX_API_KEY}}
    - {name: PLAYWRIGHT_BROWSERS_PATH, value: /opt/data/playwright-browsers}
    - {name: PATH, value: "/opt/data/.local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/opt/google-cloud-sdk/bin"}
    - {name: HERMES_TUI_DIR, value: /opt/data/ui-tui}
  dashboardAuth:
    enabled: false
  extraEnvTail: []
  lifecyclePostStart: "rm -f /usr/local/bin/argocd /usr/local/bin/helm /usr/bin/docker 2>/dev/null || true"
  # Legacy hermes-webui sidecar, same era as eugenechen-hermes but with its
  # own icon-replacement postStart hook and full volume mounts.
  # The hermes-webui sidecar was REMOVED on 2026-09-13. It had no consumer left:
  # the owner retired cindytech1-hermes.woowtech.io, and the Service that fronted
  # port 8787 went with it, so nothing could reach the container. It was still
  # reserving 500m CPU + 512Mi of requests while using 6m / 216Mi.
  #
  # Safe to remove because it produced nothing the agent consumes: the
  # playwright-shared and tools-shared emptyDirs are mounted by BOTH containers,
  # but they were verified EMPTY on both sides and no init container populates
  # them - they are vestigial ("volumes from the sidecar era"). They are left in
  # place because the agent still mounts them; dropping them is a separate,
  # larger pod-template change with no benefit.
  #
  # One more thing the removal FIXES rather than breaks: the sidecar ran a
  # background loop writing gateway_state.json every 25s with a hardcoded
  # '"gateway_state":"running"'. That file is not a webui file - the agent's
  # HERMES_HOME is /opt/data and its own gateway/status.py owns
  # gateway_state.json as the runtime status file. The two containers mount the
  # same volume, so the sidecar was continuously clobbering the agent's real
  # status with a fake "running". With the sidecar gone the agent is the only
  # writer again, and the file reflects actual gateway state.
  #
  # This cost ONE pod restart, which the owner approved. To bring the webui back,
  # restore this block AND set hermes.service.webuiPort (see values.yaml).
  extraContainers: []
  config:
    HERMES_DOMAIN: cindytech1-hermes.woowtech.io
    HERMES_BASE_URL: https://cindytech1-hermes.woowtech.io
    HERMES_AGENT_PORT: "8642"
    HERMES_WEBUI_PORT: "8787"
    POSTGRES_HOST: cindytech1-postgresql-svc
    POSTGRES_PORT: "5432"
    POSTGRES_DB: hermes
    POSTGRES_USER: hermes
    REDIS_HOST: cindytech1-redis-svc
    REDIS_PORT: "6379"
    WANTED_UID: "1000"

postgresql:
  extraLabels: null
  svcExtraLabels: null
  svcRenderLabels: false
  containerPortName: ""
  svcPortName: postgresql
  # Live has only a livenessProbe, no readinessProbe.
  probes:
    readiness: false
  volumeName: pg-data
  persistence:
    claimName: cindytech1-postgresql-pvc
    storageClassName: local-path
    size: 10Gi
  resources:
    requests: {cpu: 50m, memory: 128Mi}
    limits: {cpu: 500m, memory: 512Mi}
  # DB/USER are plain values here (not from a ConfigMap) — that's how this
  # specific live instance is actually set, unlike hermes/eugenechen.
  env:
    - {name: POSTGRES_DB, value: hermes}
    - {name: POSTGRES_USER, value: hermes}
    - name: POSTGRES_PASSWORD
      valueFrom: {secretKeyRef: {name: cindytech1-secrets, key: POSTGRES_PASSWORD}}
    - {name: PGDATA, value: /var/lib/postgresql/data/pgdata}

redis:
  extraLabels: null
  svcExtraLabels: null
  svcRenderLabels: false
  # Live has only a livenessProbe, no readinessProbe.
  probes:
    readiness: false
  containerPortName: ""
  svcPortName: redis
  persistence:
    claimName: cindytech1-redis-pvc
    storageClassName: local-path
    size: 5Gi
  resources:
    requests: {cpu: 25m, memory: 64Mi}
    limits: {cpu: 200m, memory: 256Mi}

cloudflared:
  enabled: false # belongs to the customer's Odoo stack in this namespace.
terminal:
  enabled: false
diskCleanup:
  enabled: false
networkPolicy:
  enabled: false
cloudflare:
  ingress:
    enabled: false
rbac:
  enabled: false
