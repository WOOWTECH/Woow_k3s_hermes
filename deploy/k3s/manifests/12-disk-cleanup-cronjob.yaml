# =============================================================
# Disk Cleanup CronJob — hermes-webui-data PVC hygiene
# =============================================================
# Why: state.db grows unbounded (messages FTS index), request_dump_*.json
#      accumulates one file per agent request (had 3724 files = 535MB in
#      the woow-k3s hermes namespace before cleanup). Once the PVC fills
#      up, session file writes silently corrupt (JSON truncation), causing
#      "Invalid \uXXXX escape" load errors and eventually breaking chat.
#
# What: Nightly (03:00 UTC) prune of stale on-PVC files that hermes-agent
#       never reads back — request_dump_* over 7 days, _run_journal over
#       30 days, curator logs over 30 days, rotated gateway logs beyond
#       the newest 3, plus explicit backup dirs (webui/sessions.bak-*,
#       state.db*.wipe-bak-*).
#
# Longhorn RWO note: The volume is single-node RWO, so this pod MUST run
# on the same node as the hermes pod. `podAffinity` on `app=hermes`
# enforces that.
#
# Also recommended: expand the PVC from the default 5Gi. Longhorn supports
# online expansion:
#   kubectl -n __NAMESPACE__ patch pvc hermes-webui-data \
#     -p '{"spec":{"resources":{"requests":{"storage":"20Gi"}}}}'
# =============================================================
apiVersion: batch/v1
kind: CronJob
metadata:
  name: hermes-disk-cleanup
  namespace: __NAMESPACE__
  labels:
    app: hermes-cleanup
    app.kubernetes.io/part-of: hermes
spec:
  schedule: "0 3 * * *"          # 03:00 UTC daily
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800   # keep 7 days for postmortem
      template:
        metadata:
          labels:
            app: hermes-cleanup
        spec:
          restartPolicy: OnFailure
          # Longhorn RWO: must share the hermes pod's node so the PVC
          # doesn't need to detach/reattach.
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: hermes
                topologyKey: kubernetes.io/hostname
          containers:
          - name: cleanup
            image: busybox:1.36
            resources:
              limits: {cpu: "200m", memory: "128Mi"}
              requests: {cpu: "50m", memory: "32Mi"}
            command:
            - sh
            - -c
            - |
              set -eu
              echo "[$(date -u +%FT%TZ)] hermes disk cleanup start"
              df -h /data

              # 1. Per-request debug dumps — noisy, no consumer.
              BEFORE_RD=$(find /data/sessions -name 'request_dump_*.json' -type f 2>/dev/null | wc -l)
              find /data/sessions -name 'request_dump_*.json' -type f -mtime +7 -delete 2>/dev/null || true
              AFTER_RD=$(find /data/sessions -name 'request_dump_*.json' -type f 2>/dev/null | wc -l)
              echo "  request_dumps (>7d): $BEFORE_RD -> $AFTER_RD"

              # 2. Per-run journal files — accumulate 1/turn.
              find /data/webui/sessions/_run_journal -mindepth 1 -type f -mtime +30 -delete 2>/dev/null || true
              find /data/webui/sessions/_run_journal -mindepth 1 -type d -empty -delete 2>/dev/null || true

              # 3. Curator run logs (skills catalog scans).
              find /data/logs/curator -mindepth 1 -type f -mtime +30 -delete 2>/dev/null || true
              find /data/logs/curator -mindepth 1 -type d -empty -delete 2>/dev/null || true

              # 4. Rotated gateway logs — keep only the newest 3.
              ls -1t /data/logs/gateways/default/*.s 2>/dev/null | tail -n +4 | xargs -r rm -f

              # 5. Explicit backup dirs from manual wipe operations.
              rm -rf /data/webui/sessions.bak-* 2>/dev/null || true
              rm -f  /data/state.db*.wipe-bak-* 2>/dev/null || true

              df -h /data
              echo "[$(date -u +%FT%TZ)] hermes disk cleanup done"
            volumeMounts:
            - {name: data, mountPath: /data}
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: hermes-webui-data
