{{- if .Values.networkPolicy.enabled }}
{{- $instance := include "hermes.instance" . }}
{{- $agentLabel := .Values.networkPolicy.agentSelectorLabel | default $instance }}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $instance }}-postgresql-policy
  namespace: {{ include "hermes.ns" . }}
  labels:
    app.kubernetes.io/part-of: hermes
spec:
  podSelector:
    matchLabels:
      app: {{ $instance }}-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ $agentLabel }}
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ $instance }}-redis-policy
  namespace: {{ include "hermes.ns" . }}
  labels:
    app.kubernetes.io/part-of: hermes
spec:
  podSelector:
    matchLabels:
      app: {{ $instance }}-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: {{ $agentLabel }}
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}
