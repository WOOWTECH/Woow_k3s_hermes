{{- if .Values.networkPolicy.enabled }}
{{- if .Values.postgresql.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.namespace.name }}-postgresql-policy
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes-postgresql
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hermes-agent
      ports:
        - protocol: TCP
          port: 5432
{{- end }}
{{- if .Values.redis.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ .Values.namespace.name }}-redis-policy
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: hermes
spec:
  podSelector:
    matchLabels:
      app: hermes-redis
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: hermes-agent
      ports:
        - protocol: TCP
          port: 6379
{{- end }}
{{- end }}
