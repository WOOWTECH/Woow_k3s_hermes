{{- $instance := include "hermes.instance" . }}
{{- $h := .Values.hermes }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $instance }}
  namespace: {{ include "hermes.ns" . }}
  {{- if $h.renderLabels }}
  labels:
    app: {{ $instance }}
    {{- with $h.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ $h.replicaCount }}
  strategy:
    type: {{ $h.strategy }}
  selector:
    matchLabels:
      app: {{ $instance }}
  template:
    metadata:
      labels:
        app: {{ $instance }}
    spec:
      {{- if $h.serviceAccountName }}
      serviceAccountName: {{ include "hermes.subst" (list $ $h.serviceAccountName) }}
      {{- end }}
      {{- with $h.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with $h.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: hermes-agent
        image: "{{ $h.image.repository }}:{{ $h.image.tag }}"
        imagePullPolicy: {{ $h.image.pullPolicy }}
        args: [gateway, run]
        ports:
        - {containerPort: 8642, name: gateway, protocol: TCP}
        - {containerPort: 9119, name: dashboard, protocol: TCP}
        env:
          {{- include "hermes.substYaml" (list $ $h.env) | nindent 8 }}
        {{- if $h.dashboardAuth.enabled }}
        - name: HERMES_DASHBOARD_BASIC_AUTH_USERNAME
          value: {{ include "hermes.subst" (list $ $h.dashboardAuth.username) | quote }}
        - name: HERMES_DASHBOARD_BASIC_AUTH_PASSWORD
          value: {{ include "hermes.subst" (list $ $h.dashboardAuth.password) | quote }}
        {{- end }}
        {{- with $h.extraEnvTail }}
        {{- include "hermes.substYaml" (list $ .) | nindent 8 }}
        {{- end }}
        {{- if $h.lifecyclePostStart }}
        lifecycle:
          postStart:
            exec:
              command: ["sh", "-c", {{ include "hermes.subst" (list $ $h.lifecyclePostStart) | quote }}]
        {{- end }}
        {{- if $h.probes.enabled }}
        readinessProbe:
          tcpSocket: {port: 8642}
          initialDelaySeconds: 10
          periodSeconds: 10
          failureThreshold: 6
        livenessProbe:
          tcpSocket: {port: 8642}
          initialDelaySeconds: 30
          periodSeconds: 30
          failureThreshold: 5
        {{- end }}
        resources:
          {{- toYaml $h.resources | nindent 10 }}
        {{- with $h.containerSecurityContext }}
        securityContext:
          {{- toYaml . | nindent 10 }}
        {{- end }}
        volumeMounts:
        - {mountPath: /opt/data, name: hermes-data}
        {{- if $h.sharedVolumes.enabled }}
        - {mountPath: /shared-pw, name: playwright-shared}
        - {mountPath: /shared-tools, name: tools-shared}
        {{- end }}
      {{- with $h.extraContainers }}
      {{- include "hermes.substYaml" (list $ .) | nindent 6 }}
      {{- end }}
      volumes:
      - name: hermes-data
        persistentVolumeClaim:
          claimName: {{ include "hermes.subst" (list $ $h.persistence.claimName) }}
      {{- if $h.sharedVolumes.enabled }}
      - name: playwright-shared
        emptyDir: {}
      - name: tools-shared
        emptyDir: {}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instance }}-agent-svc
  namespace: {{ include "hermes.ns" . }}
  {{- if $h.svcRenderLabels }}
  labels:
    app: {{ $instance }}
    {{- with $h.svcExtraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  selector:
    app: {{ $instance }}
  ports:
  - port: {{ $h.service.gatewayPort }}
    targetPort: 8642
    name: gateway
    protocol: TCP
    {{- if and (eq $h.service.type "NodePort") $h.service.nodePort }}
    nodePort: {{ $h.service.nodePort }}
    {{- end }}
  - port: {{ $h.service.dashboardPort }}
    targetPort: 9119
    name: dashboard
    protocol: TCP
    {{- if and (eq $h.service.type "NodePort") $h.service.dashboardNodePort }}
    nodePort: {{ $h.service.dashboardNodePort }}
    {{- end }}
  type: {{ $h.service.type }}
{{- /*
Extra Services, rendered verbatim EXCEPT metadata.namespace, which this
chart always overrides with the release namespace. A namespace baked into a
values file would survive `-n <test-ns>` and write straight into the live
namespace during a rehearsal.
*/ -}}
{{- range $svc := $h.extraServices }}
---
apiVersion: {{ $svc.apiVersion | default "v1" }}
kind: {{ $svc.kind | default "Service" }}
metadata:
  {{- toYaml (omit ($svc.metadata | default dict) "namespace") | nindent 2 }}
  namespace: {{ include "hermes.ns" $ }}
spec:
  {{- toYaml $svc.spec | nindent 2 }}
{{- end }}
{{- if and $h.serviceAccount.create $h.serviceAccountName }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "hermes.subst" (list $ $h.serviceAccountName) }}
  namespace: {{ include "hermes.ns" . }}
{{- end }}
---
# Agent data PVC. Name kept overridable (see hermes.persistence.claimName
# comment in values.yaml) for backward compatibility with pre-existing
# volumes from the sidecar era.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "hermes.subst" (list $ $h.persistence.claimName) }}
  namespace: {{ include "hermes.ns" . }}
  {{- include "hermes.keepAnnotations" . | nindent 2 }}
spec:
  storageClassName: {{ $h.persistence.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $h.persistence.size }}
