{{- /*
Namespace. Skipped when it equals the release namespace: Helm keeps its
release record there, so it is created with --create-namespace instead and
can never be deleted by `helm uninstall`.
*/ -}}
{{- if and .Values.namespace.create (ne (include "hermes.ns" .) .Release.Namespace) }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ include "hermes.ns" . }}
  labels:
    app.kubernetes.io/part-of: hermes
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  {{- include "hermes.keepAnnotations" . | nindent 2 }}
{{- end }}
