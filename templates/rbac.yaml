{{- /*
Opt-in RBAC for the agent ServiceAccount. Off by default: see the comment on
rbac.enabled in values.yaml — none of the three live instances have this.
Cluster-scoped names are instance-prefixed so two releases (in the same or
different namespaces) never collide on one ClusterRole/ClusterRoleBinding.
*/ -}}
{{- if .Values.rbac.enabled }}
{{- $instance := include "hermes.instance" . }}
{{- $sa := include "hermes.subst" (list $ (required "hermes.serviceAccountName is required when rbac.enabled=true" .Values.hermes.serviceAccountName)) }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $instance }}-agent-cluster-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "endpoints", "namespaces", "nodes",
                "configmaps", "persistentvolumeclaims", "events"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["ingresses", "networkpolicies"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["storage.k8s.io"]
    resources: ["storageclasses"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $instance }}-agent-cluster-reader-binding
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ include "hermes.ns" . }}
roleRef:
  kind: ClusterRole
  name: {{ $instance }}-agent-cluster-reader
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ $instance }}-agent-ns-writer
  namespace: {{ include "hermes.ns" . }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments/scale"]
    verbs: ["get", "patch", "update"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ $instance }}-agent-ns-writer-binding
  namespace: {{ include "hermes.ns" . }}
subjects:
  - kind: ServiceAccount
    name: {{ $sa }}
    namespace: {{ include "hermes.ns" . }}
roleRef:
  kind: Role
  name: {{ $instance }}-agent-ns-writer
  apiGroup: rbac.authorization.k8s.io
{{- end }}
