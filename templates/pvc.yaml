{{- end }}
---
# Hermes Agent Data PVC — name retained (hermes-webui-data) for backward
# compatibility with existing PVs from prior sidecar-era deployments.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.hermes.persistence.claimName }}
  namespace: {{ .Values.namespace.name }}
  labels:
    app: hermes
    app.kubernetes.io/part-of: hermes
spec:
  storageClassName: {{ .Values.hermes.persistence.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.hermes.persistence.size }}
