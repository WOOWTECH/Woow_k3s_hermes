{{- if .Values.terminal.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: hermes-terminal-sa
  namespace: {{ .Values.namespace.name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: hermes-terminal-role
  namespace: {{ .Values.namespace.name }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/exec"]
    verbs: ["create", "get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: hermes-terminal-rb
  namespace: {{ .Values.namespace.name }}
subjects:
  - kind: ServiceAccount
    name: hermes-terminal-sa
    namespace: {{ .Values.namespace.name }}
roleRef:
  kind: Role
  name: hermes-terminal-role
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: hermes-terminal-scripts
  namespace: {{ .Values.namespace.name }}
data:
  connect.sh: |
    #!/bin/sh
    NAMESPACE="{{ .Values.namespace.name }}"
    LABEL="app=hermes"
    CONTAINER="hermes-agent"
    while true; do
      POD=$(kubectl get pod -l "$LABEL" -n "$NAMESPACE" \
        --field-selector=status.phase=Running \
        -o jsonpath='{.items[0].metadata.name}' 2>/dev/null)
      if [ -n "$POD" ]; then
        echo "Connecting to $POD ($CONTAINER)..."
        kubectl exec -it "$POD" -n "$NAMESPACE" -c "$CONTAINER" -- /bin/bash
        echo ""
        echo "Session ended. Reconnecting in 2s..."
        sleep 2
      else
        echo "Waiting for hermes-agent pod..."
        sleep 5
      fi
    done
  startup.sh: |
    #!/bin/bash
    if [ ! -f /usr/local/bin/ttyd ]; then
      apt-get update && apt-get install -y --no-install-recommends curl ca-certificates && rm -rf /var/lib/apt/lists/*
      curl -sLo /usr/local/bin/ttyd https://github.com/tsl0922/ttyd/releases/download/1.7.7/ttyd.x86_64
      chmod +x /usr/local/bin/ttyd
      curl -sLo /usr/local/bin/kubectl "https://dl.k8s.io/release/$(curl -sL https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
      chmod +x /usr/local/bin/kubectl
    fi
    echo "Starting ttyd on :7681..."
    exec ttyd -p 7681 -c "admin:${TUI_PASSWORD}" -W /scripts/connect.sh
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-terminal
  namespace: {{ .Values.namespace.name }}
  labels:
    app: hermes-terminal
    app.kubernetes.io/component: terminal
    app.kubernetes.io/part-of: hermes
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: hermes-terminal
  template:
    metadata:
      labels:
        app: hermes-terminal
    spec:
      serviceAccountName: hermes-terminal-sa
      containers:
        - name: ttyd
          image: "{{ .Values.terminal.image.repository }}:{{ .Values.terminal.image.tag }}"
          imagePullPolicy: {{ .Values.terminal.image.pullPolicy }}
          command: ["bash", "/scripts/startup.sh"]
          ports:
            - containerPort: 7681
              name: ttyd
          env:
            - name: TUI_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: TTYD_PASSWORD
                  optional: true
          volumeMounts:
            - name: scripts
              mountPath: /scripts
          resources:
            {{- toYaml .Values.terminal.resources | nindent 12 }}
          readinessProbe:
            tcpSocket:
              port: 7681
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 7681
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: scripts
          configMap:
            name: hermes-terminal-scripts
            defaultMode: 0755
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-terminal-svc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: hermes-terminal
    app.kubernetes.io/part-of: hermes
spec:
  selector:
    app: hermes-terminal
  ports:
    - name: ttyd
      protocol: TCP
      port: {{ .Values.terminal.service.port }}
      targetPort: 7681
  type: {{ .Values.terminal.service.type }}
{{- end }}
