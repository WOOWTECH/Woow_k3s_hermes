{{- if .Values.diskCleanup.enabled }}
{{- $instance := include "hermes.instance" . }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ $instance }}-disk-cleanup
  namespace: {{ include "hermes.ns" . }}
  labels:
    app: {{ $instance }}-cleanup
spec:
  schedule: {{ .Values.diskCleanup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 2
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      ttlSecondsAfterFinished: 604800
      template:
        metadata:
          labels:
            app: {{ $instance }}-cleanup
        spec:
          restartPolicy: OnFailure
          affinity:
            podAffinity:
              requiredDuringSchedulingIgnoredDuringExecution:
              - labelSelector:
                  matchLabels:
                    app: {{ $instance }}
                topologyKey: kubernetes.io/hostname
          containers:
          - name: cleanup
            image: "{{ .Values.diskCleanup.image.repository }}:{{ .Values.diskCleanup.image.tag }}"
            imagePullPolicy: {{ .Values.diskCleanup.image.pullPolicy }}
            resources:
              {{- toYaml .Values.diskCleanup.resources | nindent 14 }}
            command:
            - sh
            - -c
            - |
              set -eu
              echo "[$(date -u +%FT%TZ)] hermes disk cleanup start"
              df -h /data
              BEFORE_RD=$(find /data/sessions -name 'request_dump_*.json' -type f 2>/dev/null | wc -l)
              find /data/sessions -name 'request_dump_*.json' -type f -mtime +7 -delete 2>/dev/null || true
              AFTER_RD=$(find /data/sessions -name 'request_dump_*.json' -type f 2>/dev/null | wc -l)
              echo "  request_dumps: $BEFORE_RD -> $AFTER_RD"
              find /data/webui/sessions/_run_journal -mindepth 1 -type f -mtime +30 -delete 2>/dev/null || true
              find /data/webui/sessions/_run_journal -mindepth 1 -type d -empty -delete 2>/dev/null || true
              find /data/logs/curator -mindepth 1 -type f -mtime +30 -delete 2>/dev/null || true
              find /data/logs/curator -mindepth 1 -type d -empty -delete 2>/dev/null || true
              ls -1t /data/logs/gateways/default/*.s 2>/dev/null | tail -n +4 | xargs -r rm -f
              rm -rf /data/webui/sessions.bak-* 2>/dev/null || true
              rm -f /data/state.db*.wipe-bak-* 2>/dev/null || true
              df -h /data
              echo "[$(date -u +%FT%TZ)] hermes disk cleanup done"
            volumeMounts:
            - {name: data, mountPath: /data}
          volumes:
          - name: data
            persistentVolumeClaim:
              claimName: {{ include "hermes.subst" (list $ .Values.hermes.persistence.claimName) }}
{{- end }}
