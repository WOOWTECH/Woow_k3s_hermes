{{- if .Values.postgresql.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-postgresql
  namespace: {{ .Values.namespace.name }}
  labels:
    app: hermes-postgresql
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: hermes
spec:
  replicas: {{ .Values.postgresql.replicaCount }}
  strategy:
    type: {{ .Values.postgresql.strategy }}
  selector:
    matchLabels:
      app: hermes-postgresql
  template:
    metadata:
      labels:
        app: hermes-postgresql
    spec:
      containers:
        - name: postgresql
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.postgresql.image.pullPolicy }}
          ports:
            - containerPort: 5432
              name: postgres
          env:
            - name: POSTGRES_DB
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: POSTGRES_DB
            - name: POSTGRES_USER
              valueFrom:
                configMapKeyRef:
                  name: hermes-config
                  key: POSTGRES_USER
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: hermes-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - hermes
                - -d
                - hermes
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - hermes
                - -d
                - hermes
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ .Values.postgresql.persistence.claimName }}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-postgresql-svc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: hermes-postgresql
    app.kubernetes.io/part-of: hermes
spec:
  selector:
    app: hermes-postgresql
  ports:
    - protocol: TCP
      port: {{ .Values.postgresql.service.port }}
      targetPort: 5432
      name: postgres
  type: {{ .Values.postgresql.service.type }}
{{- end }}
