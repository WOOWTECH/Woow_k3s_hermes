{{- if .Values.postgresql.enabled }}
{{- $instance := include "hermes.instance" . }}
{{- $p := .Values.postgresql }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $instance }}-postgresql
  namespace: {{ include "hermes.ns" . }}
  {{- if $p.renderLabels }}
  labels:
    app: {{ $instance }}-postgresql
    {{- with $p.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  replicas: {{ $p.replicaCount }}
  strategy:
    {{- toYaml $p.strategy | nindent 4 }}
  selector:
    matchLabels:
      app: {{ $instance }}-postgresql
  template:
    metadata:
      labels:
        app: {{ $instance }}-postgresql
    spec:
      containers:
        - name: {{ $p.containerName }}
          image: "{{ $p.image.repository }}:{{ $p.image.tag }}"
          imagePullPolicy: {{ $p.image.pullPolicy }}
          ports:
            - containerPort: 5432
              {{- if $p.containerPortName }}
              name: {{ $p.containerPortName }}
              {{- end }}
              protocol: TCP
          env:
            {{- toYaml $p.env | nindent 12 }}
          {{- if $p.probes.enabled }}
          readinessProbe:
            exec:
              command: [pg_isready, -U, hermes, -d, hermes]
            initialDelaySeconds: 10
            periodSeconds: 10
            failureThreshold: 5
          livenessProbe:
            exec:
              command: [pg_isready, -U, hermes, -d, hermes]
            initialDelaySeconds: 30
            periodSeconds: 30
            failureThreshold: 3
          {{- end }}
          resources:
            {{- toYaml $p.resources | nindent 12 }}
          {{- if $p.persistence.enabled }}
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          {{- end }}
      {{- if $p.persistence.enabled }}
      volumes:
        - name: postgres-data
          persistentVolumeClaim:
            claimName: {{ $p.persistence.claimName }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $instance }}-postgresql-svc
  namespace: {{ include "hermes.ns" . }}
  {{- if $p.renderLabels }}
  labels:
    app: {{ $instance }}-postgresql
    {{- with $p.extraLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  selector:
    app: {{ $instance }}-postgresql
  ports:
    - protocol: TCP
      port: {{ $p.service.port }}
      targetPort: 5432
      {{- if $p.svcPortName }}
      name: {{ $p.svcPortName }}
      {{- end }}
  type: {{ $p.service.type }}
{{- if $p.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ $p.persistence.claimName }}
  namespace: {{ include "hermes.ns" . }}
  {{- include "hermes.keepAnnotations" . | nindent 2 }}
spec:
  storageClassName: {{ $p.persistence.storageClassName }}
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ $p.persistence.size }}
{{- end }}
{{- end }}
