{{- /*
Secrets, rendered only with secrets.create=true. By default (secrets.create:
false) they already exist out of band — see examples/secrets.example.yaml —
and this chart never touches them, so an upgrade can never overwrite a real
key with an empty one.
*/ -}}
{{- if .Values.secrets.create }}
{{- $instance := include "hermes.instance" . }}
{{- $s := .Values.secrets }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ $instance }}-secrets
  namespace: {{ include "hermes.ns" . }}
  {{- include "hermes.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  API_SERVER_KEY: {{ required "secrets.API_SERVER_KEY is required when secrets.create=true" $s.API_SERVER_KEY | quote }}
  MINIMAX_API_KEY: {{ required "secrets.MINIMAX_API_KEY is required when secrets.create=true" $s.MINIMAX_API_KEY | quote }}
  {{- if .Values.postgresql.enabled }}
  POSTGRES_PASSWORD: {{ required "secrets.POSTGRES_PASSWORD is required when secrets.create=true and postgresql.enabled=true" $s.POSTGRES_PASSWORD | quote }}
  {{- end }}
  {{- if .Values.terminal.enabled }}
  TTYD_PASSWORD: {{ required "secrets.TTYD_PASSWORD is required when secrets.create=true and terminal.enabled=true" $s.TTYD_PASSWORD | quote }}
  {{- end }}
  {{- range $k, $v := $s.extraEnv }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- if .Values.cloudflared.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  # Not instance-scoped: one Cloudflare Tunnel per namespace.
  name: cf-secrets
  namespace: {{ include "hermes.ns" . }}
  {{- include "hermes.keepAnnotations" . | nindent 2 }}
type: Opaque
stringData:
  CF_API_TOKEN: {{ required "secrets.CF_API_TOKEN is required when secrets.create=true and cloudflared.enabled=true" $s.CF_API_TOKEN | quote }}
  CF_TUNNEL_TOKEN: {{ required "secrets.CF_TUNNEL_TOKEN is required when secrets.create=true and cloudflared.enabled=true" $s.CF_TUNNEL_TOKEN | quote }}
{{- end }}
{{- end }}
