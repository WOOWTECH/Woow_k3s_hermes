{{- if .Values.redis.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: hermes-redis
  namespace: {{ .Values.namespace.name }}
  labels:
    app: hermes-redis
    app.kubernetes.io/component: cache
    app.kubernetes.io/part-of: hermes
spec:
  replicas: {{ .Values.redis.replicaCount }}
  strategy:
    type: {{ .Values.redis.strategy }}
  selector:
    matchLabels:
      app: hermes-redis
  template:
    metadata:
      labels:
        app: hermes-redis
    spec:
      containers:
        - name: redis
          image: "{{ .Values.redis.image.repository }}:{{ .Values.redis.image.tag }}"
          imagePullPolicy: {{ .Values.redis.image.pullPolicy }}
          ports:
            - containerPort: 6379
              name: redis
          command:
            - redis-server
            - --appendonly
            - "yes"
            - --maxmemory
            - "256mb"
            - --maxmemory-policy
            - "allkeys-lru"
          volumeMounts:
            - name: redis-data
              mountPath: /data
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 15
            periodSeconds: 30
            failureThreshold: 3
          resources:
            {{- toYaml .Values.redis.resources | nindent 12 }}
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: {{ .Values.redis.persistence.claimName }}
---
apiVersion: v1
kind: Service
metadata:
  name: hermes-redis-svc
  namespace: {{ .Values.namespace.name }}
  labels:
    app: hermes-redis
    app.kubernetes.io/part-of: hermes
spec:
  selector:
    app: hermes-redis
  ports:
    - protocol: TCP
      port: {{ .Values.redis.service.port }}
      targetPort: 6379
      name: redis
  type: {{ .Values.redis.service.type }}
{{- end }}
