apiVersion: v1
kind: Secret
metadata:
  name: hermes-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: hermes
type: Opaque
stringData:
  API_SERVER_KEY: {{ .Values.secrets.API_SERVER_KEY | quote }}
  MINIMAX_API_KEY: {{ .Values.secrets.MINIMAX_API_KEY | quote }}
  POSTGRES_PASSWORD: {{ .Values.secrets.POSTGRES_PASSWORD | quote }}
  {{- if .Values.terminal.enabled }}
  TTYD_PASSWORD: {{ .Values.secrets.TTYD_PASSWORD | quote }}
  {{- end }}
{{- if .Values.cloudflared.enabled }}
---
apiVersion: v1
kind: Secret
metadata:
  name: cf-secrets
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: hermes
type: Opaque
stringData:
  CF_API_TOKEN: {{ .Values.secrets.CF_API_TOKEN | quote }}
  CF_TUNNEL_TOKEN: {{ .Values.secrets.CF_TUNNEL_TOKEN | quote }}
{{- end }}
