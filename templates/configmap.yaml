{{- $instance := include "hermes.instance" . }}
{{- if .Values.hermes.configMap.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $instance }}-config
  namespace: {{ include "hermes.ns" . }}
data:
  {{- range $key, $value := .Values.hermes.config }}
  {{ $key }}: {{ include "hermes.subst" (list $ $value) | quote }}
  {{- end }}
{{- end }}
{{- if .Values.hermes.toolsetsOverride.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $instance }}-toolsets-override
  namespace: {{ include "hermes.ns" . }}
data:
  {{- range $key, $value := .Values.hermes.toolsetsOverride.data }}
  {{ $key }}: |
    {{- $value | nindent 4 }}
  {{- end }}
{{- end }}
{{- /*
No cf-config ConfigMap: the cloudflared Deployment reads TUNNEL_TOKEN
straight from the cf-secrets Secret. None of the three live instances have
a cf-config object, so this chart doesn't render one either.
*/ -}}
